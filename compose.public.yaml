services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - convert
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - conversion
      - egress
volumes:
  caddy_data:
  caddy_config:
networks:
  egress:
